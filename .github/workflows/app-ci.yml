# Tests the Gaurav.OS app on every push and pull request. It never deploys.
name: app-ci
on:
  push:
    paths: ["app/**", "brand/**", "site/content.js", "site/corpus.js", ".github/workflows/app-ci.yml"]
  pull_request:
    paths: ["app/**", "brand/**", "site/content.js", "site/corpus.js"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm run prepare-data   # generated data is not committed
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: reports, path: app/reports }
      # Preview without deploying: download "site-preview", unzip, run `npx serve` (or app/scripts/serve.mjs) in it.
      - uses: actions/upload-artifact@v4
        with: { name: site-preview, path: app/build/client, retention-days: 14 }
