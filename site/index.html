.pv.end .k{color:var(--jade)}
.pv .t{font-size:14px;color:var(--text);margin-top:4px;max-width:60ch}
.funnel{display:grid;gap:7px;margin-top:var(--s2)}
.fbar{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center;font-size:12px}
.fbar .lab{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.fbar .track{height:20px;background:var(--line-soft);position:relative}
.fbar .fill{height:100%;background:linear-gradient(90deg,var(--gold),rgba(210,166,60,.35))}
.fbar .val{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;color:var(--bone)}
.fbar .val.out{right:-4px;transform:translate(100%,-50%);padding-left:8px;white-space:nowrap}
@media (max-width:1120px){.fbar .val.out{right:8px;transform:translateY(-50%);padding-left:0;color:var(--gold)}}

/* ---------- copilot ---------- */
.copilot{border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
.copilot-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  padding:11px 15px;border-bottom:1px solid var(--line-soft);background:var(--panel-2)}
.trace{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.11em;color:var(--dim)}
.trace .step{padding:3px 7px;border:1px solid var(--line);border-radius:2px;transition:color .3s,border-color .3s,background .3s}
.trace .step.on{color:var(--gold);border-color:rgba(210,166,60,.45);background:var(--gold-soft)}
.trace .step.done{color:var(--jade);border-color:rgba(79,144,119,.35);background:var(--jade-soft)}
.thread{padding:16px;display:flex;flex-direction:column;gap:18px;max-height:440px;overflow-y:auto}
.msg{display:flex;gap:11px;align-items:flex-start}
.msg .who{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.14em;color:var(--dim);flex:0 0 44px;padding-top:4px;text-transform:uppercase}
.msg .body{flex:1;min-width:0;font-size:14.5px}
.msg.user .body{color:var(--bone)}
.msg .body p+p{margin-top:10px}
.msg .body ul{margin:10px 0 0;padding-left:17px;color:var(--muted)}
.msg .body li{margin-bottom:5px}
.msg .body b{font-weight:500;color:var(--bone)}
.msg .body a{color:var(--gold)}
.grounded{display:flex;align-items:center;gap:7px;margin-top:13px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.16em;color:var(--jade)}
.src-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;align-items:center}
.src-row .lbl{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.16em;color:var(--dim)}
.ask-form{display:flex;gap:8px;border-top:1px solid var(--line-soft);padding:12px 15px;background:var(--panel-2);flex-wrap:wrap}
.ask-input{flex:1;min-width:170px;background:var(--ink);border:1px solid var(--line);color:var(--text);padding:11px 13px;border-radius:2px;font-size:14px}
.ask-input::placeholder{color:var(--dim)}
.ask-send{border:1px solid var(--gold);background:var(--gold-soft);color:var(--gold);padding:11px 16px;border-radius:2px;
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.16em;transition:background .2s,color .2s}
.ask-send:hover{background:var(--gold);color:#12100A}
.prompt-bar{border-top:1px solid var(--line-soft);padding:12px 15px;background:var(--panel-2)}
.prompt-list{display:grid;gap:5px;margin-top:8px}
.prompt-btn{text-align:left;font-size:13px;color:var(--muted);border-left:1px solid var(--line);
  padding:6px 11px;transition:border-color .18s,color .18s,background .18s,padding-left .18s}
.prompt-btn:hover{border-left-color:var(--gold);color:var(--bone);background:var(--gold-soft);padding-left:15px}
.typing{display:inline-flex;gap:4px;align-items:center}
.typing i{width:4px;height:4px;border-radius:50%;background:var(--dim);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}

/* ---------- challenge ---------- */
.challenge{border:1px solid var(--line-soft);background:var(--panel);margin-bottom:var(--s2)}
.challenge-head{padding:18px 20px;border-bottom:1px solid var(--line-soft)}
.challenge-sc{font-family:"Instrument Serif",Georgia,serif;font-size:20px;color:var(--bone);margin-top:10px;line-height:1.3}
.challenge-ask{font-size:14px;color:var(--gold);margin-top:8px}
.opts{display:grid;gap:8px;padding:16px 20px}
.opt{text-align:left;border:1px solid var(--line);padding:11px 13px;border-radius:2px;font-size:13.5px;color:var(--muted);
  display:flex;gap:11px;align-items:flex-start;transition:border-color .18s,color .18s,background .18s}
.opt:hover{border-color:var(--gold);color:var(--text)}
.opt .letter{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;color:var(--dim);padding-top:2px}
.opt[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft);color:var(--bone)}
.opt[aria-pressed="true"] .letter{color:var(--gold)}
.why-box{padding:0 20px 16px}
.why-box textarea{width:100%;background:var(--ink);border:1px solid var(--line);color:var(--text);
  padding:10px 12px;border-radius:2px;font-size:13.5px;min-height:60px;resize:vertical}
.why-box textarea::placeholder{color:var(--dim)}
.reveal{border-top:1px solid var(--line-soft);padding:20px;background:var(--panel-2)}
.approach{display:grid;margin-top:var(--s2)}
.step{display:grid;grid-template-columns:118px 1fr;gap:16px;padding:11px 0;border-top:1px solid var(--line-soft);font-size:13.5px}
.step:first-child{border-top:none}
.step dt{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.14em;color:var(--gold);padding-top:3px;text-transform:uppercase}
.step dd{margin:0;color:var(--text)}
.step dd b{color:var(--bone);font-weight:500}

/* ---------- journey ---------- */
.journey{position:relative;margin-top:var(--s3);padding-left:26px}
.journey::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:linear-gradient(180deg,var(--line),var(--gold),var(--line))}
.stop{position:relative;padding-bottom:22px;display:block;text-align:left;width:100%}
.stop::before{content:"";position:absolute;left:-25px;top:7px;width:11px;height:11px;border-radius:50%;
  border:1px solid var(--line);background:var(--ink);transition:background .2s,border-color .2s}
.stop[data-open="true"]::before{background:var(--gold);border-color:var(--gold)}
.stop:hover::before{border-color:var(--gold)}
.stop-when{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.14em;color:var(--dim);display:flex;gap:9px;align-items:center}
.stop-phase{color:var(--gold);letter-spacing:.16em}
.stop-what{font-family:"Instrument Serif",Georgia,serif;font-size:20px;color:var(--bone);line-height:1.2;margin-top:3px}
.stop-where{font-size:12.5px;color:var(--muted);margin-top:3px}
.stop-detail{font-size:13.5px;color:var(--muted);margin-top:10px;max-width:60ch;border-left:1px solid var(--line);padding-left:14px}
.arc{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:var(--s3);padding:15px 17px;
  border:1px solid var(--line-soft);background:var(--panel);
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.1em;color:var(--muted)}
.arc b{color:var(--gold);font-weight:500}

/* ---------- lab ---------- */
.timeline{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);margin-top:var(--s2)}
.tl{background:var(--panel);padding:12px 11px;display:flex;flex-direction:column;gap:5px;min-height:100px;text-align:left;transition:background .2s}
.tl:hover{background:var(--panel-2)}
.tl .w{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.16em;color:var(--gold)}
.tl .c{font-size:11.5px;color:var(--text);line-height:1.35}
.tl .s{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.14em;color:var(--dim);margin-top:auto}
.filters{display:flex;flex-wrap:wrap;gap:7px;margin:var(--s3) 0 var(--s2)}
.note-card{border:1px solid var(--line-soft);background:var(--panel);padding:16px 18px;text-align:left;width:100%;display:block;transition:border-color .18s,background .18s,transform .18s}
.note-card:hover{border-color:var(--gold);background:var(--panel-2);transform:translateY(-2px)}
.note-meta{display:flex;flex-wrap:wrap;gap:9px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.13em;color:var(--dim);text-transform:uppercase;align-items:center}
.note-title{font-family:"Instrument Serif",Georgia,serif;font-size:20px;color:var(--bone);margin-top:9px;line-height:1.22}
.note-dek{font-size:13.5px;color:var(--muted);margin-top:7px}
.reader{position:fixed;inset:0;z-index:90;background:color-mix(in srgb,var(--ink) 93%,transparent);
  backdrop-filter:blur(8px);display:flex;justify-content:center;overflow-y:auto;
  padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px))}
.reader-inner{max-width:640px;width:100%;background:var(--panel);border:1px solid var(--line);padding:26px 24px 34px;height:max-content}
.reader-body{margin-top:var(--s3);font-size:15.5px;line-height:1.74}
.reader-body p+p{margin-top:14px}
.reader-body h4{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.17em;color:var(--gold);margin-top:22px;text-transform:uppercase}
.reader-close{position:sticky;top:0;float:right;margin:-6px -4px 0 0}
.rd-h{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.17em;color:var(--gold);margin-top:24px;text-transform:uppercase}
.rd-src{margin:9px 0 0;padding-left:18px;font-size:13.5px;color:var(--muted)}
.rd-src li{margin-bottom:5px}
.rd-src a{color:var(--gold)}
.xp{border:1px solid var(--line-soft);background:var(--panel);margin-bottom:var(--s1);transition:border-color .2s}
.xp:hover{border-color:var(--line)}
.xp-head{display:flex;gap:13px;align-items:center;padding:13px 16px;width:100%;text-align:left;transition:background .18s}
.xp-head:hover{background:var(--panel-2)}
.xp-head .id{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;color:var(--dim);flex:0 0 56px}
.xp-head .nm{font-size:14.5px;color:var(--text);flex:1}
.xp-body{padding:2px 16px 18px 72px;background:var(--panel-2)}
.st-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px}
.st-jade{background:var(--jade)} .st-gold{background:var(--gold)} .st-dim{background:var(--dim)}

/* ---------- loop ---------- */
.loopwrap{display:grid;grid-template-columns:196px 1fr;gap:var(--s3);margin-top:var(--s3);align-items:start}
.looprail{position:relative;display:grid;gap:2px;border-left:1px solid var(--line)}
.loopbtn{text-align:left;padding:9px 14px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;
  letter-spacing:.15em;color:var(--muted);border-left:2px solid transparent;margin-left:-1px;
  transition:color .2s,border-color .2s,background .2s,padding-left .2s;display:flex;align-items:center;gap:9px}
.loopbtn:hover{color:var(--text);background:var(--line-soft)}
.loopbtn[aria-pressed="true"]{color:var(--gold);border-left-color:var(--gold);background:var(--gold-soft);padding-left:18px}
.loopbtn .i{font-size:10px;color:var(--dim)}
.loopbtn[aria-pressed="true"] .i{color:var(--gold)}
.loopback{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.14em;color:var(--dim);padding:9px 14px;border-left:2px dashed var(--line);margin-left:-1px}
.loopdetail{background:var(--panel);border:1px solid var(--line-soft);padding:20px;min-height:186px}
.loopdetail .h{font-family:"Instrument Serif",Georgia,serif;font-size:26px;color:var(--bone);line-height:1.1}
.loopdetail .d{margin-top:10px;font-size:14.5px}
.evid{margin-top:var(--s2);padding-top:var(--s2);border-top:1px solid var(--line-soft);display:grid;gap:8px}
.evid .e{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:baseline;font-size:13px;color:var(--muted)}
.evid .e b{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;color:var(--gold);font-variant-numeric:tabular-nums;font-weight:500}
.principles{display:grid}
.principle{display:grid;grid-template-columns:28px 1fr;gap:14px;padding:13px 0;border-top:1px solid var(--line-soft);font-size:14.5px}
.principle:first-child{border-top:none}
.principle .i{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;color:var(--gold);padding-top:3px}
.principle .s{color:var(--muted);font-size:13px;margin-top:3px}

/* ---------- about ---------- */
.tool-group{margin-top:var(--s3)}
.tool-group h3{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.2em;color:var(--gold);margin-bottom:11px;text-transform:uppercase}
.rec-item{padding:11px 0;border-top:1px solid var(--line-soft)}
.rec-item:first-child{border-top:none}
.rec-item .h{display:flex;justify-content:space-between;gap:14px;align-items:baseline;flex-wrap:wrap}
.rec-item .r{font-size:15.5px;color:var(--bone);font-weight:500;line-height:1.35}
.rec-item .d{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;color:var(--dim);white-space:nowrap}
.rec-item .o{font-size:13px;color:var(--muted);margin-top:2px}
.rec-item ul{margin:8px 0 0;padding-left:17px;font-size:13.5px;color:var(--text)}
.rec-item li{margin-bottom:5px}

/* ---------- contact ---------- */
.contact-line{font-family:"Instrument Serif",Georgia,serif;font-size:clamp(26px,5vw,42px);color:var(--bone);line-height:1.12}
.links{display:grid;gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);margin-top:var(--s3)}
.link{display:flex;align-items:baseline;gap:14px;padding:15px 18px;background:var(--panel);text-decoration:none;transition:background .18s;flex-wrap:wrap}
.link:hover{background:var(--panel-2)}
.link .k{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.17em;color:var(--dim);flex:0 0 76px;text-transform:uppercase}
.link .v{color:var(--text);font-size:14.5px;word-break:break-word}
.link:hover .v{color:var(--gold)}
footer{padding:34px 0 calc(46px + env(safe-area-inset-bottom,0px));color:var(--dim);font-size:12.5px}

/* ---------- recruiter ---------- */
#recruiter{display:none}
.rec-nav{display:none}
[data-mode="recruiter"] .rec-nav{display:block}
[data-mode="recruiter"] .lab-only{display:none!important}
[data-mode="recruiter"] #recruiter{display:block}
.rec-head{padding-block:46px 10px}
.rec-name{font-family:"Instrument Serif",Georgia,serif;font-size:clamp(32px,6vw,48px);color:var(--bone);line-height:1.05}
.rec-role{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.2em;color:var(--gold);margin-top:12px;text-transform:uppercase}
.rec-sum{display:grid;gap:5px;margin-top:var(--s3);max-width:70ch}
.rec-sum div{display:grid;grid-template-columns:auto 1fr;gap:11px;font-size:15px;align-items:baseline}
.rec-sum b{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.14em;color:var(--gold);font-weight:500}
.rec-sec{padding-block:26px;border-top:1px solid var(--line);scroll-margin-top:70px}
.rec-sec .rec-h{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.22em;color:var(--dim);margin-bottom:14px;text-transform:uppercase}

/* ---------- search ---------- */
.search-overlay{position:fixed;inset:0;z-index:95;background:color-mix(in srgb,var(--ink) 94%,transparent);
  backdrop-filter:blur(10px);display:flex;justify-content:center;
  padding:calc(60px + env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto}
.search-box{max-width:620px;width:100%;height:max-content}
.search-field{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--panel);padding:2px 2px 2px 14px}
.search-field input{flex:1;background:none;border:none;color:var(--text);padding:14px 0;font-size:16px;outline:none}
.search-field input::placeholder{color:var(--dim)}
.search-results{margin-top:var(--s2);display:grid;gap:1px;background:var(--line-soft);border:1px solid var(--line-soft)}
.sr-item{display:grid;grid-template-columns:auto 1fr;gap:13px;padding:13px 15px;background:var(--panel);text-align:left;width:100%;transition:background .15s}
.sr-item:hover{background:var(--panel-2)}
.sr-item .ty{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.14em;color:var(--gold);padding-top:4px;flex:0 0 auto;min-width:64px}
.sr-item .ti{font-size:14.5px;color:var(--bone)}
.sr-item .ex{font-size:12.5px;color:var(--muted);margin-top:2px}
.search-empty{padding:20px 15px;background:var(--panel);font-size:14px;color:var(--muted)}


/* ---------- corpus: constellation ---------- */
:root{
  --viz-health:#c98500; --viz-ai:#9085e9; --viz-other:#199e70;
  --viz-grid:#1E272E; --viz-bar:#C99A3A;
}
[data-mode="recruiter"]{ --viz-health:#8A6714; --viz-ai:#4a3aa7; --viz-other:#15795a; --viz-grid:#E2DCCE; --viz-bar:#8A6714; }
.const-wrap{position:relative;margin-top:var(--s3);border:1px solid var(--line-soft);background:var(--panel)}
.const-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;
  padding:11px 14px;border-bottom:1px solid var(--line-soft);background:var(--panel-2)}
.const-legend{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.lg{display:inline-flex;align-items:center;gap:6px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.13em;color:var(--muted);text-transform:uppercase;background:none;border:none;padding:2px 0}
.lg i{width:9px;height:9px;border-radius:50%;display:inline-block}
.lg[aria-pressed="false"]{opacity:.4}
.const-stage{position:relative;aspect-ratio:16/9;width:100%}
.const-stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.const-tip{position:absolute;pointer-events:none;z-index:5;background:var(--ink);border:1px solid var(--gold);
  padding:9px 11px;max-width:250px;opacity:0;transition:opacity .12s}
.const-tip.on{opacity:1}
.const-tip .d{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.14em;color:var(--gold)}
.const-tip .c{font-size:13.5px;color:var(--bone);margin-top:3px}
.const-tip .m{font-size:11.5px;color:var(--muted);margin-top:4px}
.const-foot{display:flex;flex-wrap:wrap;gap:14px;padding:10px 14px;border-top:1px solid var(--line-soft);
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.13em;color:var(--dim)}

/* ---------- corpus: atlas ---------- */
.atlas-controls{display:grid;gap:var(--s2);margin-top:var(--s3)}
.atlas-search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);padding:0 12px}
.atlas-search input{flex:1;background:none;border:none;color:var(--text);padding:13px 0;font-size:15px;outline:none}
.atlas-search input::placeholder{color:var(--dim)}
.facet{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.facet .fl{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.16em;color:var(--dim);margin-right:4px;min-width:62px}
.atlas-count{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.14em;color:var(--muted);margin-top:var(--s2)}
.atlas-list{display:grid;gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);margin-top:var(--s1)}
.cs-row{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:start;padding:14px 16px;background:var(--panel);
  text-align:left;width:100%;transition:background .15s}
.cs-row:hover{background:var(--panel-2)}
.cs-row .day{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;color:var(--gold);padding-top:3px;font-variant-numeric:tabular-nums}
.cs-row .co{font-size:15px;color:var(--bone)}
.cs-row .sm{font-size:12.5px;color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cs-row .meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.cs-row .ev{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.tag{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.12em;padding:2px 6px;border:1px solid var(--line);color:var(--dim);text-transform:uppercase}
.tag.on{color:var(--gold);border-color:rgba(210,166,60,.4)}
.ev-pill{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.12em;padding:3px 7px;border:1px solid var(--line);white-space:nowrap}
.ev-VERIFIED{color:var(--viz-other);border-color:var(--viz-other)}
.ev-DOCUMENTED{color:var(--gold);border-color:rgba(210,166,60,.5)}
.ev-SOURCED{color:var(--muted)}
.ev-NARRATIVE{color:var(--dim)}
.cs-empty{padding:22px 16px;background:var(--panel);color:var(--muted);font-size:14px}
.atlas-more{margin-top:var(--s2)}

/* ---------- case study detail ---------- */
.cs-panel{position:fixed;inset:0;z-index:92;background:color-mix(in srgb,var(--ink) 93%,transparent);
  backdrop-filter:blur(8px);display:flex;justify-content:center;overflow-y:auto;
  padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px))}
.cs-inner{max-width:620px;width:100%;background:var(--panel);border:1px solid var(--line);padding:24px 22px 30px;height:max-content}
.cs-inner .hd{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.16em;color:var(--gold)}
.cs-inner h3{font-family:"Instrument Serif",Georgia,serif;font-size:27px;color:var(--bone);margin-top:8px;line-height:1.15}
.cs-inner .sub{font-size:14px;color:var(--muted);margin-top:8px}
.cs-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:var(--s3)}
.cs-kv{display:grid;grid-template-columns:132px 1fr;gap:6px 16px;margin-top:var(--s3);font-size:13px}
.cs-kv dt{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.15em;color:var(--dim);padding-top:3px;text-transform:uppercase}
.cs-kv dd{margin:0;color:var(--text)}

.val-flags{margin-top:var(--s3);border-top:1px solid var(--line-soft);padding-top:var(--s2)}
.vf-h{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.15em;color:var(--dim)}
.vf{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline;margin-top:7px;font-size:12px}
.vf-k{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.1em;color:var(--gold);
  border:1px solid rgba(210,166,60,.35);padding:2px 6px;white-space:nowrap}
.vf-d{color:var(--muted)}

/* ---------- corpus: charts ---------- */
.viz-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);margin-top:var(--s3)}
.viz{border:1px solid var(--line-soft);background:var(--panel);padding:16px}
.viz h4{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.16em;color:var(--gold);text-transform:uppercase}
.viz .sub{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.4}
.bars{display:grid;gap:5px;margin-top:var(--s2)}
.brow{display:grid;grid-template-columns:54px 1fr 56px;gap:9px;align-items:center;font-size:11px}
.brow .bl{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.1em;color:var(--muted)}
.brow .bt{height:14px;background:var(--viz-grid);position:relative;overflow:hidden}
.brow .bf{height:100%;background:var(--viz-bar);border-radius:0 3px 3px 0}
.brow .bv{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;color:var(--bone);text-align:right;font-variant-numeric:tabular-nums}
.dist{display:grid;gap:5px;margin-top:var(--s2)}
.drow{display:grid;grid-template-columns:92px 1fr 34px;gap:9px;align-items:center;font-size:11px}
.drow .dl{font-size:11.5px;color:var(--text)}
.drow .dt{height:12px;background:var(--viz-grid);position:relative;overflow:hidden}
.drow .df{height:100%;border-radius:0 3px 3px 0}
.drow .dv{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}

.spark{display:flex;align-items:flex-end;gap:2px;height:78px;margin-top:var(--s2);
  background:linear-gradient(180deg,transparent,var(--viz-grid) 96%);padding-bottom:1px}
.spark .sb{flex:1;background:var(--viz-bar);border-radius:2px 2px 0 0;min-width:3px;transition:opacity .15s}
.spark .sb:hover{opacity:.7}
.spark-axis{display:flex;justify-content:space-between;margin-top:6px;
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.12em;color:var(--dim)}
.cs-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:var(--s3);
  padding-top:var(--s2);border-top:1px solid var(--line-soft)}
.cs-nav button[disabled]{opacity:.35;cursor:default}

/* ---------- method graph ---------- */
.caps{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);margin-top:var(--s3)}
.cap{background:var(--panel);padding:15px;display:flex;flex-direction:column;gap:7px;text-align:left;transition:background .18s}
.cap:hover{background:var(--panel-2)}
.cap .ct{font-size:14.5px;color:var(--bone)}
.cap .cm{height:4px;background:var(--viz-grid);position:relative;overflow:hidden}
.cap .cf{height:100%;background:var(--gold)}
.cap .cn{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.12em;color:var(--muted)}
.cap .cb{font-size:11.5px;color:var(--dim);line-height:1.4}

/* ---------- operating model ---------- */
.model{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:var(--s3)}
.mstep{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--line);background:var(--panel);
  transition:border-color .2s,background .2s,color .2s}
.mstep:hover{border-color:var(--gold);background:var(--panel-2)}
.mstep[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}
.mstep .mi{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;color:var(--dim)}
.mstep .ml{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.14em;color:var(--muted)}
.mstep[aria-pressed="true"] .ml{color:var(--gold)}
.mstep .mc{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.marr{color:var(--dim);font-size:10px}
.mloop{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.14em;color:var(--dim);margin-left:4px}
.model-detail{border:1px solid var(--line-soft);background:var(--panel);padding:18px;margin-top:var(--s2);min-height:170px}
.md-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px}
.md-n{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.16em;color:var(--dim)}
.md-t{font-family:"Instrument Serif",Georgia,serif;font-size:25px;color:var(--bone);line-height:1}
.md-c{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;color:var(--gold);margin-left:auto;font-variant-numeric:tabular-nums}
.md-b{font-size:14px;color:var(--muted);margin-top:9px;max-width:62ch}
.md-lbl{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.15em;color:var(--dim)}
.md-prac{margin-top:14px;display:grid;gap:6px}
.md-p{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:baseline;font-size:13px;color:var(--muted)}
.md-p b{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11.5px;color:var(--gold);font-weight:500;font-variant-numeric:tabular-nums}
.md-cov{height:4px;background:var(--viz-grid);margin-top:7px;overflow:hidden}
.md-covf{display:block;height:100%;background:var(--gold)}
.md-ev{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.md-s{display:flex;flex-direction:column;gap:4px;align-items:flex-start;padding:10px;border:1px solid var(--line);
  background:var(--panel-2);text-align:left;transition:border-color .18s}
.md-s:hover{border-color:var(--gold)}
.md-sd{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.14em;color:var(--gold)}
.md-sc{font-size:12.5px;color:var(--text);line-height:1.25}

.om{display:flex;flex-wrap:wrap;align-items:stretch;gap:5px;margin-top:var(--s3)}
.omb{display:flex;flex-direction:column;gap:4px;padding:11px 12px;border:1px solid var(--line);
  background:var(--panel);text-align:left;min-width:104px;flex:1;transition:border-color .2s,background .2s}
.omb:hover{border-color:var(--gold);background:var(--panel-2)}
.omb[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}
.omb-n{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.14em;color:var(--dim)}
.omb[aria-pressed="true"] .omb-n{color:var(--gold)}
.omb-l{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.11em;color:var(--text)}
.omb[aria-pressed="true"] .omb-l{color:var(--bone)}
.omb-c{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:14px;color:var(--gold);
  font-variant-numeric:tabular-nums;margin-top:auto}
.omb-arr{align-self:center;color:var(--dim);font-size:10px}
.om-detail{border:1px solid var(--line-soft);background:var(--panel);padding:18px;margin-top:var(--s2);min-height:150px}
.omd-head{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap}
.omd-n{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;color:var(--gold)}
.omd-t{font-family:"Instrument Serif",Georgia,serif;font-size:25px;color:var(--bone)}
.omd-c{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.12em;color:var(--muted);margin-left:auto}
.omd-b{font-size:14px;color:var(--text);margin-top:9px;max-width:64ch}
.omd-ex{display:grid;gap:5px;margin-top:var(--s2)}
.omd-s{display:flex;align-items:center;gap:11px;padding:9px 11px;border:1px solid var(--line-soft);
  background:var(--panel-2);text-align:left;transition:border-color .18s}
.omd-s:hover{border-color:var(--gold)}
.omd-s .d{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;color:var(--gold);min-width:48px}
.omd-s .c{font-size:13.5px;color:var(--text);flex:1}

/* ---------- anomalies ---------- */
.anom{border:1px solid rgba(210,166,60,.3);background:var(--gold-soft);padding:16px;margin-top:var(--s3)}
.anom h4{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.16em;color:var(--gold);text-transform:uppercase}
.anom ul{margin:10px 0 0;padding-left:17px;font-size:13px;color:var(--text)}
.anom li{margin-bottom:5px}
.i-arr{color:var(--dim);font-size:10px}


/* ---------- intro: the boot film ---------- */
.intro{position:fixed;inset:0;z-index:120;background:#000;display:flex;align-items:center;justify-content:center;
  opacity:1;transition:opacity .6s ease}
.intro.out{opacity:0;pointer-events:none}
.intro.hold .ov:not(.br){opacity:0;transition:opacity .5s ease}
.film-stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#000}
.film{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.film-vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 54%,rgba(0,0,0,.42) 88%,rgba(0,0,0,.72) 100%)}
.intro .ov{position:absolute;z-index:3;opacity:0;transition:opacity .7s ease .3s}
.intro.ready .ov,.intro.still .ov{opacity:1}
.ov.tl{top:calc(26px + env(safe-area-inset-top,0px));left:26px}
.ov.bl{bottom:calc(64px + env(safe-area-inset-bottom,0px));left:26px}
.ov.br{bottom:calc(26px + env(safe-area-inset-bottom,0px));right:22px}
/* SOUND sits beside SKIP as a peer control, not a footnote. Both are
   available from the first frame, before .ready reveals the rest.        */
.ov-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:flex-end;
  max-width:calc(100vw - 48px)}
.intro .ov-actions{opacity:1}
.ov-sound{display:inline-flex;align-items:center;gap:8px;
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.18em;
  color:rgba(255,255,255,.66);border:1px solid rgba(255,255,255,.22);padding:9px 13px;border-radius:2px;
  background:rgba(0,0,0,.25);backdrop-filter:blur(3px);white-space:nowrap;
  transition:color .2s,border-color .2s,background .2s}
.ov-sound:hover{color:#fff;border-color:var(--gold);background:rgba(0,0,0,.5)}
.ov-sound .sdot{flex:none;width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.28);
  transition:background .2s,box-shadow .2s}
.ov-sound[aria-pressed="true"]{color:#fff;border-color:rgba(210,166,60,.55)}
.ov-sound[aria-pressed="true"] .sdot{background:var(--gold);box-shadow:0 0 0 3px rgba(210,166,60,.18)}
@media (max-width:420px){
  .ov-actions{gap:7px;max-width:calc(100vw - 36px)}
  .ov-sound{letter-spacing:.12em;padding:9px 10px;gap:6px}
  .ov-skip{letter-spacing:.12em;padding:9px 11px}
  .ov.br{right:16px}
}
.ov-mark{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13px;letter-spacing:.2em;
  font-weight:600;color:rgba(255,255,255,.92)}
.ov-mark i{font-style:normal;color:var(--gold)}
.ov-sub{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.3em;
  color:rgba(255,255,255,.45);margin-top:5px}
.ov-name{font-family:"Instrument Serif",Georgia,serif;font-size:20px;color:rgba(255,255,255,.92);line-height:1.1}
.ov-skip{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.18em;
  color:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.22);padding:9px 14px;border-radius:2px;
  background:rgba(0,0,0,.25);backdrop-filter:blur(3px);transition:color .2s,border-color .2s,background .2s}
.ov-skip:hover{color:#fff;border-color:var(--gold);background:rgba(0,0,0,.5)}
.intro .ov-skip{opacity:1}
.ov-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.18em;
  color:#fff;border:1px solid rgba(255,255,255,.4);padding:14px 22px;border-radius:2px;
  background:rgba(0,0,0,.45);backdrop-filter:blur(4px);opacity:1!important}
.ov-play:hover{border-color:var(--gold)}
.film-bar{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.1);z-index:4}
.film-bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .25s linear}
.film-load{position:absolute;z-index:4;display:flex;gap:5px}
.film-load span{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.4);animation:blink 1.2s infinite}
.film-load span:nth-child(2){animation-delay:.2s}
.film-load span:nth-child(3){animation-delay:.4s}

/* ---------- hero: person + corpus tease ---------- */

/* ---------- reveal ---------- */
.rv{transition:opacity .6s ease,transform .6s ease}
.rv.pre{opacity:.5;transform:translateY(10px)}

/* ---------- recruiter-first hero ---------- */
/* Answers three questions in reading order: who (name + identity), which
   roles (the seeking row), and what proof (three cards). Actions sit
   between roles and proof so they are inside the first screen on a phone. */
section.mod.hero{padding-block:clamp(28px,6vw,64px) var(--s5)}
.kicker{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase}
.hero-name{font-family:"Instrument Serif",Georgia,serif;font-size:clamp(40px,7.4vw,68px);line-height:1;color:var(--bone);margin-top:12px;letter-spacing:-.01em}
.hero-title{font-size:clamp(18px,2.6vw,23px);color:var(--text);margin-top:10px;font-weight:500}
.hero-intro{font-size:clamp(15.5px,1.9vw,17px);color:var(--muted);margin-top:12px;max-width:62ch}
.seek{margin-top:var(--s3);display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.seek-k{display:inline-flex;align-items:center;gap:7px;font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:11px;letter-spacing:.16em;color:var(--jade);text-transform:uppercase;margin-right:2px}
.seek-k .pulse{flex:none}
.role{font-size:13.5px;color:var(--bone);border:1px solid var(--line);background:var(--panel);padding:5px 10px;border-radius:2px;white-space:nowrap}
.hero .cta-row{margin-top:var(--s3)}
.btn{min-height:44px;font-size:11.5px}
.btn-primary:focus-visible{outline-color:var(--bone)}
.hero-meta{margin-top:12px;font-size:13.5px;color:var(--muted)}
.hero-meta a{color:var(--text)}
.proof{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2);margin-top:var(--s4)}
.proof-card{display:flex;flex-direction:column;gap:9px;padding:18px;background:var(--panel);border:1px solid var(--line);
  border-top:2px solid var(--gold);text-decoration:none;color:inherit;transition:border-color .18s,background .18s}
.proof-card:hover{background:var(--panel-2);border-color:var(--gold)}
.proof-card .pk{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.14em;color:var(--gold);text-transform:uppercase}
.proof-card .pc{font-size:15.5px;line-height:1.45;color:var(--bone)}
.proof-card .pf{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:6px}
.proof-card .pl{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.12em;color:var(--text)}
.ev-label{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.12em;padding:3px 7px;border:1px solid var(--line);
  color:var(--muted);white-space:nowrap;text-transform:uppercase}
.ev-label.warn{color:var(--gold);border-color:rgba(210,166,60,.5);background:var(--gold-soft)}
.proof-note{font-size:13px;color:var(--muted);margin-top:var(--s2);max-width:70ch}

/* ---------- selected work ---------- */
.case.primary{margin-top:var(--s5)}
.case-proof{margin-top:var(--s2);padding:14px 16px;border-left:2px solid var(--gold);background:var(--gold-soft);font-size:15.5px;color:var(--bone)}
.case-proof .ev-label{margin-left:8px;vertical-align:2px}
.prod-flag{margin-top:var(--s2);padding:12px 14px;border:1px solid rgba(210,166,60,.5);font-size:14px;color:var(--text);
  display:flex;gap:10px;align-items:baseline}
.prod-flag b{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.14em;color:var(--gold);white-space:nowrap;font-weight:500}
.more-work{margin-top:var(--s6)}
.mw{border:1px solid var(--line-soft);background:var(--panel);margin-top:-1px}
.mw>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;padding:15px 18px}
.mw>summary::-webkit-details-marker{display:none}
.mw>summary:hover{background:var(--panel-2)}
.mw>summary .t{font-size:16px;color:var(--bone)}
.mw>summary .s{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.mw>summary .x{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.12em;color:var(--dim)}
.mw[open]>summary .x{color:var(--gold)}
.mw-body{padding:0 18px 22px}
.mw-body .case{margin-top:var(--s2)}

/* ---------- contact + R&E ---------- */
.cta-band{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--s2);
  margin-top:var(--s5);padding:20px 22px;border:1px solid var(--line);background:var(--panel)}
.cta-band p{font-size:16px;color:var(--bone);max-width:44ch}
.cta-band .cta-row{margin-top:0}
.mail-big{display:inline-block;font-family:"Instrument Serif",Georgia,serif;font-size:clamp(22px,4.4vw,34px);color:var(--gold);
  margin-top:var(--s2);word-break:break-all;text-decoration-thickness:1px;text-underline-offset:6px}
.orbit-block{margin-top:var(--s4)}
#site-footer{padding-block:34px calc(46px + env(safe-area-inset-bottom,0px));color:var(--muted);font-size:13px;border-top:1px solid var(--line-soft)}
#site-footer a{color:var(--text)}

/* ---------- responsive ---------- */
@media (max-width:1000px){
  .rail{position:fixed;left:0;top:0;bottom:0;z-index:60;transform:translateX(-100%);transition:transform .26s ease;box-shadow:0 0 40px rgba(0,0,0,.5)}
  .rail[data-open="true"]{transform:none}
  .topbar{display:flex}
  .scrim{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.55);border:none}
  section.mod{scroll-margin-top:66px}
  .orbit{max-width:330px}
  .panels{grid-template-columns:1fr 1fr}
  .exec{grid-template-columns:1fr 1fr}
  .timeline{grid-template-columns:repeat(3,1fr)}
  .grid-3{grid-template-columns:1fr}

/* =====================================================================
   v6 — editorial redesign. One signal colour (gold), generous space,
   restrained motion. Later rules here deliberately refine earlier ones.
   ===================================================================== */
:root{--maxw:900px;--s6:88px}
body{line-height:1.66}
section.mod{padding-block:var(--s6);border-bottom:1px solid var(--line-soft)}
.eyebrow{font-size:11px;letter-spacing:.22em;color:var(--muted)}
.eyebrow .num{color:var(--gold)}
/* the product-intelligence motif, small: a node closing each section rule */
.eyebrow::after{background:linear-gradient(90deg,var(--line) 0,var(--line) calc(100% - 9px),transparent calc(100% - 9px))}
.eyebrow{position:relative}
.eyebrow::before{content:"";position:absolute;right:0;top:50%;width:7px;height:7px;margin-top:-3.5px;border:1px solid var(--gold);border-radius:50%}
h2.title{font-size:clamp(34px,5.4vw,52px)}
.dek{font-size:16.5px;max-width:64ch}

/* ---------- margin art: watermark + orbit motif, margins only ---------- */
.margin-art{display:none}
@media (min-width:1400px){
  .margin-art{display:block;position:fixed;top:0;bottom:0;right:0;z-index:0;pointer-events:none;
    width:calc((100vw - var(--shell-nav) - var(--maxw)) / 2 - 24px);overflow:hidden}
  .margin-art .motif{position:absolute;top:0;left:50%;width:120px;height:100%;transform:translateX(-50%)}
  .margin-art .motif line,.margin-art .motif ellipse,.margin-art .motif path{fill:none;stroke:var(--line);stroke-width:1}
  .margin-art .motif .faint{stroke:var(--line-soft)}
  .margin-art .motif circle{fill:var(--line)}
  .margin-art .motif circle.node{fill:none;stroke:var(--gold);stroke-opacity:.55}
  .margin-art .wm{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);writing-mode:vertical-rl;
    font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:600;font-size:64px;letter-spacing:.12em;
    color:var(--bone);opacity:.03;white-space:nowrap;user-select:none}
  [data-mode="recruiter"] .margin-art{display:none}
}
.shell,.main{position:relative;z-index:1}
a.wordmark{text-decoration:none}
a.wordmark:hover{color:var(--gold)}

/* ---------- hero ---------- */
section.mod.hero{padding-block:clamp(28px,3.4vw,52px) var(--s5);border-bottom:1px solid var(--line)}
.hero-name{font-size:clamp(44px,5.6vw,72px);margin-top:10px}
.hero-pos{font-family:"Instrument Serif",Georgia,serif;font-size:clamp(22px,2.3vw,27px);line-height:1.2;color:var(--bone);
  margin-top:10px;max-width:40ch}
.hero-pos em{font-style:italic;color:var(--gold)}
.hero-intro{max-width:70ch;margin-top:12px;font-size:16px}
.hero .seek{margin-top:var(--s2)}
.role{font-size:13px;padding:4px 9px}
.hero .proof{margin-top:var(--s3)}
.proof-card{padding:16px;gap:8px}
.seek-k{color:var(--gold)}
.hero .cta-row{gap:10px}
.proof-card .pc{font-size:14.5px;line-height:1.42}
.ev-label.ok{color:var(--jade);border-color:rgba(98,168,140,.5)}

/* ---------- product lab ---------- */
.lab-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s2);margin-top:var(--s4)}
.lab-card{display:flex;flex-direction:column;gap:10px;padding:20px;background:var(--panel);border:1px solid var(--line)}
.lab-card .lk{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.lab-card h3{font-family:"Instrument Serif",Georgia,serif;font-size:27px;line-height:1.05;color:var(--bone)}
.lab-card .ls{font-size:14.5px;color:var(--text)}
.lab-card .ln{font-size:13.5px;color:var(--muted);border-left:2px solid var(--gold);padding-left:10px}
.lab-card .lf{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:auto;padding-top:6px}
.lab-card.corpus{background:linear-gradient(140deg,var(--panel-2),var(--panel) 70%);grid-column:1/-1}
.lab-card .ls b{color:var(--bone);font-weight:500}
.lab-card .lm{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;color:var(--bone)}
.lab-records{margin-top:var(--s4)}

/* ---------- ask gaurav ---------- */
.ask-wrap{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:var(--s3);margin-top:var(--s3);align-items:start}
.ask-wrap .copilot{min-width:0}
.ask-side .prompt-list{margin-top:10px}
.ask-side .prompt-btn{font-size:14px;color:var(--text);padding:9px 12px;border-left:2px solid var(--line);width:100%}
.ask-side .prompt-btn:hover,.ask-side .prompt-btn:focus-visible{border-left-color:var(--gold)}
.answer{display:grid;gap:0;margin-top:2px}
.answer .ar{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:9px 0;border-top:1px solid var(--line-soft)}
.answer .ar:first-child{border-top:none;padding-top:0}
.answer dt{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.14em;color:var(--gold);padding-top:4px}
.answer dd{margin:0;font-size:14.5px;color:var(--text)}
.answer dd ul{margin:4px 0 0;padding-left:17px}
.answer dd p{margin:0}
.answer .ar.status dd{color:var(--bone)}
.thread{max-height:560px;position:relative}
/* the retrieval-trace strip is decoration; the answer format says what it is */
.ask-wrap .trace{display:none}
.ask-wrap .copilot-head{justify-content:flex-start}
.msg .who{flex-basis:56px}

/* ---------- record: experience, education, certifications ---------- */
.rec-item{padding:16px 0}
.rec-item .r{font-size:16.5px}
.cert-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);margin-top:var(--s3)}

/* ---------- explore the lab ---------- */
.explore{border-bottom:1px solid var(--line)}
.explore-sum{list-style:none;cursor:pointer;display:block;padding-block:var(--s4);background:var(--panel)}
.explore-sum::-webkit-details-marker{display:none}
.explore-sum:hover{background:var(--panel-2)}
.explore-sum:focus-visible{outline:2px solid var(--gold);outline-offset:-4px}
.explore-in{display:grid;grid-template-columns:1fr auto;gap:6px 18px;align-items:center}
.explore-k{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;letter-spacing:.2em;color:var(--gold)}
.explore-t{grid-column:1;font-size:15px;color:var(--muted);max-width:64ch}
.explore-x{grid-row:1/3;grid-column:2;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:26px;color:var(--gold);
  width:44px;height:44px;border:1px solid var(--line);display:grid;place-items:center}
.explore-x::before{content:"+"}
.explore[open] .explore-x::before{content:"\2212"}
.film-card{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center;margin-top:var(--s3);padding:16px;border:1px solid var(--line);background:var(--panel)}
.film-card img{width:200px;max-width:100%;aspect-ratio:16/9;object-fit:cover;display:block;border:1px solid var(--line-soft)}
.film-card .fc{flex:1;min-width:200px}

@media (max-width:1000px){
  .ask-wrap{grid-template-columns:1fr}
  /* on one column the questions come first, where a visitor will see them */
  .ask-side{order:-1}
  .ask-side .prompt-list{display:flex;flex-wrap:wrap;gap:6px}
  .ask-side .prompt-btn{width:auto;border:1px solid var(--line);border-left:2px solid var(--gold);font-size:13.5px;padding:8px 11px}

@media (max-width:720px){

  .msg{flex-direction:column;gap:4px}

  .hero .cta-row .btn{flex:1 1 calc(50% - 5px)}
  .hero .cta-row .btn:first-child{flex-basis:100%}
  .explore-sum{padding-block:var(--s3)}

/* small phones: the five actions in two rows — VIEW WORK and ASK GAURAV,
   then CV, EMAIL and RECRUITER — so all of them sit in the first screen */

  .topbar{gap:6px;padding-inline:12px}
  .topbar .ghost-btn{padding:9px 9px;letter-spacing:.08em}
  .kicker{font-size:10.5px}
}
