<style>
:root{
  --ink:#080A0C; --panel:#0F1418; --panel-2:#151C21; --raise:#1A2229;
  --line:#212B32; --line-soft:#171F25;
  --text:#DEE6EA; --bone:#EEE5D4; --muted:#8A98A2; --dim:#5E6C76;
  --gold:#D2A63C; --gold-soft:rgba(210,166,60,.14);
  --jade:#4F9077; --jade-soft:rgba(79,144,119,.16);
  --shell-nav:250px; --maxw:860px;
  --s1:8px; --s2:14px; --s3:22px; --s4:34px; --s5:52px; --s6:78px;
  color-scheme:dark;
}
[data-mode="recruiter"]{
  --ink:#F7F5F0; --panel:#FFFFFF; --panel-2:#F2EFE8; --raise:#EAE6DC;
  --line:#DCD6C8; --line-soft:#E8E3D8;
  --text:#1D2226; --bone:#141A1E; --muted:#5C666E; --dim:#7C858C;
  --gold:#8A6714; --gold-soft:rgba(138,103,20,.10);
  --jade:#2F6A52; --jade-soft:rgba(47,106,82,.10);
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--text);
  font-family:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  font-size:15px;line-height:1.64;font-weight:300;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4{margin:0;font-weight:400;text-wrap:balance}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea{font:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
canvas#field{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.5}
[data-mode="recruiter"] canvas#field{display:none}

/* ---------- shell ---------- */
.shell{position:relative;z-index:1;display:flex;min-height:100%}
.rail{width:var(--shell-nav);flex:0 0 var(--shell-nav);border-right:1px solid var(--line-soft);
  padding:0 0 32px;position:sticky;top:0;align-self:flex-start;height:100vh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--panel) 0%,var(--ink) 70%)}
.rail-head{padding:calc(20px + env(safe-area-inset-top,0px)) 20px 16px;border-bottom:1px solid var(--line-soft)}
.wordmark{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:15px;letter-spacing:.14em;font-weight:600;color:var(--bone)}
.wordmark .dot{color:var(--gold)}
.rail-sub{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9px;letter-spacing:.2em;color:var(--dim);margin-top:6px;text-transform:uppercase}
.rail-scroll{overflow-y:auto;padding:10px 0 8px;flex:1;scrollbar-width:thin}
.rail-group{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9px;letter-spacing:.22em;color:var(--dim);padding:14px 20px 6px;text-transform:uppercase}
.navlink{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;padding:6px 20px;color:var(--muted);
  text-decoration:none;font-size:13.5px;transition:color .18s,background .18s,border-color .18s;border-left:2px solid transparent}
.navlink .idx{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;color:var(--dim);flex:0 0 18px}
.navlink:hover{color:var(--text);background:var(--line-soft)}
.navlink[aria-current="true"]{color:var(--bone);border-left-color:var(--gold);background:var(--line-soft)}
.navlink[aria-current="true"] .idx{color:var(--gold)}
.rail-foot{padding:14px 20px 0;border-top:1px solid var(--line-soft);display:grid;gap:8px}
.status{display:flex;align-items:center;gap:8px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9.5px;letter-spacing:.14em;color:var(--muted)}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--jade);animation:pulse 2.8s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(79,144,119,.5)}70%{box-shadow:0 0 0 7px rgba(79,144,119,0)}100%{box-shadow:0 0 0 0 rgba(79,144,119,0)}}
.main{flex:1;min-width:0}
.topbar{display:none;position:sticky;top:0;z-index:40;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));
  background:color-mix(in srgb,var(--ink) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line-soft)}
.ghost-btn{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.16em;
  border:1px solid var(--line);padding:7px 11px;border-radius:2px;color:var(--muted);transition:border-color .18s,color .18s,background .18s}
.ghost-btn:hover{border-color:var(--gold);color:var(--bone)}
.ghost-btn[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);background:var(--gold-soft)}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
section.mod{padding-block:var(--s6);border-bottom:1px solid var(--line-soft);scroll-margin-top:70px}
section.mod:last-of-type{border-bottom:none}
.eyebrow{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.24em;color:var(--dim);
  text-transform:uppercase;display:flex;align-items:center;gap:10px;margin-bottom:var(--s3)}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line-soft)}
.eyebrow .num{color:var(--gold)}
h2.title{font-family:"Instrument Serif",Georgia,serif;font-size:clamp(34px,6vw,54px);line-height:1.02;color:var(--bone);letter-spacing:-.01em}
h2.title em{font-style:italic;color:var(--gold)}
.dek{color:var(--muted);margin-top:var(--s2);max-width:62ch;font-size:15.5px}
.sect-label{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;display:block}
.step-label{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:8.5px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase;display:block;margin-bottom:9px}

/* ---------- hero + orbit ---------- */
.hero{padding-block:clamp(40px,7vw,72px) var(--s6)}
.hero-grid{display:grid;grid-template-columns:1.04fr .96fr;gap:var(--s5);align-items:center}
.hero-mark{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:clamp(34px,7vw,62px);letter-spacing:-.02em;font-weight:600;color:var(--bone);line-height:1}
.hero-mark .dot{color:var(--gold)}
.hero-role{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-size:clamp(21px,3.8vw,29px);color:var(--gold);margin-top:var(--s2);line-height:1.1}
.hero-line{margin-top:var(--s2);font-size:clamp(15.5px,2.1vw,18px);color:var(--text);max-width:34ch}
.position{margin-top:var(--s3);padding-left:16px;border-left:2px solid var(--gold);font-size:14.5px;color:var(--muted);max-width:46ch}
.position b{color:var(--bone);font-weight:400}
.hero-tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:var(--s3)}
.orbit{position:relative;width:100%;max-width:400px;aspect-ratio:1/.68;margin:0 auto;perspective:900px}
.orbit-plane{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(58deg)}
.ring{position:absolute;top:50%;left:50%;border:1px solid var(--line);border-radius:50%;transform:translate(-50%,-50%)}
.ring.r1{border-style:dashed;border-color:rgba(210,166,60,.26)}
.ring.r2{opacity:.55}
.spin{position:absolute;inset:0}
.onode{position:absolute;top:50%;left:50%;width:0;height:0;will-change:transform,opacity}
.onode span{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9px;letter-spacing:.14em;
  padding:5px 9px;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:2px}
.onode.lead span{border-color:rgba(210,166,60,.4);color:var(--gold);background:var(--gold-soft)}
.onode{padding:0;cursor:pointer;background:none;border:none}
.onode span{transition:border-color .18s,color .18s,background .18s}
.onode:hover span,.onode:focus-visible span{border-color:var(--gold);color:var(--bone)}
.onode:focus-visible{outline:none}
.onode:focus-visible span{outline:2px solid var(--gold);outline-offset:3px}
/* narrow viewports: the diagram squares up and stops spinning rather than
   shrinking until the labels collide. The operating loop moves to the caption. */
.orbit.compact .ring.r2{display:none}
.orbit.compact .ring.r1{border-style:solid;border-color:var(--line)}
.orbit-cap{min-height:2.6em;transition:color .2s}
.orbit-loop{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:7px;margin-top:var(--s2)}
.loopchip{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9px;letter-spacing:.16em;
  padding:5px 10px;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:2px;
  transition:border-color .18s,color .18s,background .18s}
.loopchip:hover,.loopchip:focus-visible{border-color:var(--gold);color:var(--bone);background:var(--gold-soft)}
.loop-arr{color:var(--dim);font-size:9px}
.orbit-core{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:3;
  width:104px;height:104px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:radial-gradient(circle at 50% 40%,var(--panel-2),var(--ink) 72%);border:1px solid var(--line);box-shadow:0 18px 44px rgba(0,0,0,.5)}
.orbit-core .om{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.1em;font-weight:600;color:var(--bone);white-space:nowrap;line-height:1.15;display:block}
.orbit-core .ol{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:7px;letter-spacing:.18em;color:var(--dim)}
.orbit-cap{text-align:center;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9px;letter-spacing:.16em;color:var(--dim);margin-top:var(--s2)}
.panels{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);margin-top:var(--s5)}
.panel{background:var(--panel);padding:15px 15px 17px;min-height:112px;display:flex;flex-direction:column;gap:7px;transition:background .2s}
.panel:hover{background:var(--panel-2)}
.panel .k{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:8.5px;letter-spacing:.16em;color:var(--dim)}
.panel .v{font-family:"Instrument Serif",Georgia,serif;font-size:21px;color:var(--bone);line-height:1.12}
.panel .m{font-size:11.5px;color:var(--muted);margin-top:auto}
.cta-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:var(--s4)}
.btn{display:inline-flex;align-items:center;gap:9px;padding:13px 19px;border-radius:2px;
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.16em;text-decoration:none;
  transition:transform .2s,background .2s,border-color .2s,color .2s}
.btn-primary{background:var(--gold);color:#12100A;font-weight:600}
.btn-primary:hover{transform:translateY(-1px);background:#E2B64C}
.btn-secondary{border:1px solid var(--line);color:var(--muted)}
.btn-secondary:hover{border-color:var(--gold);color:var(--bone)}
.btn-secondary[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft);color:var(--gold)}
.hero-note{margin-top:var(--s3);font-size:12.5px;color:var(--dim);max-width:58ch}

/* ---------- primitives ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:9.5px;letter-spacing:.14em;padding:4px 9px;border:1px solid var(--line);border-radius:2px;
  color:var(--muted);text-transform:uppercase;text-decoration:none}
a.chip:hover,button.chip:hover{border-color:var(--gold);color:var(--gold)}
.chip.gold{border-color:rgba(210,166,60,.4);color:var(--gold);background:var(--gold-soft)}
.chip.jade{border-color:rgba(79,144,119,.4);color:var(--jade);background:var(--jade-soft)}
.chip.dim{color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.card{background:var(--panel);border:1px solid var(--line-soft);padding:20px;transition:border-color .2s,transform .2s}
.card.lift:hover{border-color:var(--line);transform:translateY(-2px)}
.stack{display:grid;gap:var(--s2)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2)}
.small{font-size:13px;color:var(--muted)}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.note,p.note{font-size:13px;color:var(--muted);border-left:1px solid var(--line);padding-left:12px;margin-top:11px}
.kv{display:grid;grid-template-columns:128px 1fr;gap:7px 18px;font-size:13.5px}
.kv dt{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9.5px;letter-spacing:.16em;color:var(--dim);padding-top:4px;text-transform:uppercase}
.kv dd{margin:0;color:var(--text)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:var(--s2) 0 4px}
.flow .node{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9px;letter-spacing:.11em;
  padding:6px 9px;border:1px solid var(--line);background:var(--panel);color:var(--muted)}
.flow .node.now{border-color:var(--gold);color:var(--gold);background:var(--gold-soft)}
.flow .arr{color:var(--dim);font-size:10px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);margin-top:var(--s2)}
.metric{background:var(--panel);padding:14px}
.metric .n{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:20px;color:var(--bone);font-variant-numeric:tabular-nums}
.metric .l{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.35}

/* ---------- work index + project ---------- */
.work-index{display:grid;gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);margin-top:var(--s3)}
.wi{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:16px 18px;background:var(--panel);
  text-align:left;width:100%;transition:background .18s}
.wi:hover{background:var(--panel-2)}
.wi .n{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;color:var(--gold)}
.wi .t{font-size:15.5px;color:var(--bone)}
.wi .s{font-size:12px;color:var(--muted);margin-top:2px}
.case{margin-top:var(--s6);scroll-margin-top:70px}
.case-head{border:1px solid var(--line);background:linear-gradient(140deg,var(--panel-2),var(--panel) 62%);padding:26px 24px}
.case-title{font-family:"Instrument Serif",Georgia,serif;font-size:clamp(32px,6.4vw,54px);line-height:1;color:var(--bone)}
.case-sub{color:var(--gold);font-size:15px;margin-top:9px;font-family:"Instrument Serif",Georgia,serif;font-style:italic}
.case-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:var(--s2)}
.case-headline{font-size:16.5px;color:var(--text);margin-top:var(--s3);max-width:60ch}
.exec{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);margin-top:var(--s2)}
.exec-cell{background:var(--panel);padding:14px 15px;display:flex;flex-direction:column;gap:6px;transition:background .2s}
.exec-cell:hover{background:var(--panel-2)}
.exec-cell .k{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:8.5px;letter-spacing:.17em;color:var(--gold)}
.exec-cell .t{font-size:12.5px;color:var(--text);line-height:1.42}
.exec-cell.alert{background:linear-gradient(140deg,rgba(210,166,60,.16),var(--panel) 70%);border-left:2px solid var(--gold)}
.exec-cell.alert .t{color:var(--bone)}
.acc{border:1px solid var(--line-soft);border-top:none}
.acc:first-of-type{border-top:1px solid var(--line-soft)}
.acc-btn{width:100%;display:flex;align-items:center;gap:12px;padding:13px 18px;background:var(--panel);
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.17em;color:var(--muted);
  transition:background .18s,color .18s;text-align:left}
.acc-btn:hover{background:var(--panel-2);color:var(--bone)}
.acc-btn .caret{margin-left:auto;color:var(--dim);transition:transform .22s}
.acc-btn[aria-expanded="true"]{color:var(--bone);background:var(--panel-2)}
.acc-btn[aria-expanded="true"] .caret{transform:rotate(90deg);color:var(--gold)}
.acc-body{padding:4px 18px 20px;background:var(--panel-2);font-size:14.5px;color:var(--text)}
.acc-body p+p{margin-top:11px}
.acc-body ul{margin:11px 0 0;padding-left:18px;color:var(--muted)}
.acc-body li{margin-bottom:6px}
.acc-body li b,.acc-body p b{color:var(--bone);font-weight:500}
.log{border:1px solid var(--line-soft);margin-top:var(--s2)}
.log-row{border-bottom:1px solid var(--line-soft)}
.log-row:last-child{border-bottom:none}
.log-btn{width:100%;text-align:left;padding:13px 16px;background:var(--panel);display:flex;gap:12px;align-items:baseline;transition:background .18s}
.log-btn:hover{background:var(--panel-2)}
.log-btn .id{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9.5px;color:var(--gold);flex:0 0 30px}
.log-btn .d{font-size:14px;color:var(--text)}
.log-body{padding:2px 16px 18px 58px;background:var(--panel-2)}
.pivot{position:relative;padding-left:24px;margin-top:var(--s3)}
.pivot::before{content:"";position:absolute;left:4px;top:10px;bottom:10px;width:1px;background:linear-gradient(180deg,var(--line),var(--gold) 45%,var(--jade))}
.pv{position:relative;padding:0 0 15px}
.pv::before{content:"";position:absolute;left:-24px;top:9px;width:9px;height:9px;border-radius:50%;background:var(--ink);border:1px solid var(--line)}
.pv.hot::before{background:var(--gold);border-color:var(--gold)}
.pv.end::before{background:var(--jade);border-color:var(--jade)}
.pv .k{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9px;letter-spacing:.17em;color:var(--dim)}
.pv.hot .k{color:var(--gold)}
.pv.end .k{color:var(--jade)}
.pv .t{font-size:14px;color:var(--text);margin-top:4px;max-width:60ch}
.funnel{display:grid;gap:7px;margin-top:var(--s2)}
.fbar{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center;font-size:12px}
.fbar .lab{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9.5px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.fbar .track{height:20px;background:var(--line-soft);position:relative}
.fbar .fill{height:100%;background:linear-gradient(90deg,var(--gold),rgba(210,166,60,.35))}
.fbar .val{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;color:var(--bone)}
.fbar .val.out{right:-4px;transform:translate(100%,-50%);padding-left:8px;white-space:nowrap}
@media (max-width:1120px){.fbar .val.out{right:8px;transform:translateY(-50%);padding-left:0;color:var(--gold)}}

/* ---------- copilot ---------- */
.copilot{border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
.copilot-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  padding:11px 15px;border-bottom:1px solid var(--line-soft);background:var(--panel-2)}
.trace{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:8.5px;letter-spacing:.11em;color:var(--dim)}
.trace .step{padding:3px 7px;border:1px solid var(--line);border-radius:2px;transition:color .3s,border-color .3s,background .3s}
.trace .step.on{color:var(--gold);border-color:rgba(210,166,60,.45);background:var(--gold-soft)}
.trace .step.done{color:var(--jade);border-color:rgba(79,144,119,.35);background:var(--jade-soft)}
.thread{padding:16px;display:flex;flex-direction:column;gap:18px;max-height:440px;overflow-y:auto}
.msg{display:flex;gap:11px;align-items:flex-start}
.msg .who{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:8.5px;letter-spacing:.14em;color:var(--dim);flex:0 0 44px;padding-top:4px;text-transform:uppercase}
.msg .body{flex:1;min-width:0;font-size:14.5px}
.msg.user .body{color:var(--bone)}
.msg .body p+p{margin-top:10px}
.msg .body ul{margin:10px 0 0;padding-left:17px;color:var(--muted)}
.msg .body li{margin-bottom:5px}
.msg .body b{font-weight:500;color:var(--bone)}
.msg .body a{color:var(--gold)}
.grounded{display:flex;align-items:center;gap:7px;margin-top:13px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:8.5px;letter-spacing:.16em;color:var(--jade)}
.src-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;align-items:center}
.src-row .lbl{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:8.5px;letter-spacing:.16em;color:var(--dim)}
.ask-form{display:flex;gap:8px;border-top:1px solid var(--line-soft);padding:12px 15px;background:var(--panel-2);flex-wrap:wrap}
.ask-input{flex:1;min-width:170px;background:var(--ink);border:1px solid var(--line);color:var(--text);padding:11px 13px;border-radius:2px;font-size:14px}
.ask-input::placeholder{color:var(--dim)}
.ask-send{border:1px solid var(--gold);background:var(--gold-soft);color:var(--gold);padding:11px 16px;border-radius:2px;
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.16em;transition:background .2s,color .2s}
.ask-send:hover{background:var(--gold);color:#12100A}
.prompt-bar{border-top:1px solid var(--line-soft);padding:12px 15px;background:var(--panel-2)}
.prompt-list{display:grid;gap:5px;margin-top:8px}
.prompt-btn{text-align:left;font-size:13px;color:var(--muted);border-left:1px solid var(--line);
  padding:6px 11px;transition:border-color .18s,color .18s,background .18s,padding-left .18s}
.prompt-btn:hover{border-left-color:var(--gold);color:var(--bone);background:var(--gold-soft);padding-left:15px}
.typing{display:inline-flex;gap:4px;align-items:center}
.typing i{width:4px;height:4px;border-radius:50%;background:var(--dim);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}

/* ---------- challenge ---------- */
.challenge{border:1px solid var(--line-soft);background:var(--panel);margin-bottom:var(--s2)}
.challenge-head{padding:18px 20px;border-bottom:1px solid var(--line-soft)}
.challenge-sc{font-family:"Instrument Serif",Georgia,serif;font-size:20px;color:var(--bone);margin-top:10px;line-height:1.3}
.challenge-ask{font-size:14px;color:var(--gold);margin-top:8px}
.opts{display:grid;gap:8px;padding:16px 20px}
.opt{text-align:left;border:1px solid var(--line);padding:11px 13px;border-radius:2px;font-size:13.5px;color:var(--muted);
  display:flex;gap:11px;align-items:flex-start;transition:border-color .18s,color .18s,background .18s}
.opt:hover{border-color:var(--gold);color:var(--text)}
.opt .letter{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;color:var(--dim);padding-top:2px}
.opt[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft);color:var(--bone)}
.opt[aria-pressed="true"] .letter{color:var(--gold)}
.why-box{padding:0 20px 16px}
.why-box textarea{width:100%;background:var(--ink);border:1px solid var(--line);color:var(--text);
  padding:10px 12px;border-radius:2px;font-size:13.5px;min-height:60px;resize:vertical}
.why-box textarea::placeholder{color:var(--dim)}
.reveal{border-top:1px solid var(--line-soft);padding:20px;background:var(--panel-2)}
.approach{display:grid;margin-top:var(--s2)}
.step{display:grid;grid-template-columns:118px 1fr;gap:16px;padding:11px 0;border-top:1px solid var(--line-soft);font-size:13.5px}
.step:first-child{border-top:none}
.step dt{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9.5px;letter-spacing:.14em;color:var(--gold);padding-top:3px;text-transform:uppercase}
.step dd{margin:0;color:var(--text)}
.step dd b{color:var(--bone);font-weight:500}

/* ---------- journey ---------- */
.journey{position:relative;margin-top:var(--s3);padding-left:26px}
.journey::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:linear-gradient(180deg,var(--line),var(--gold),var(--line))}
.stop{position:relative;padding-bottom:22px;display:block;text-align:left;width:100%}
.stop::before{content:"";position:absolute;left:-25px;top:7px;width:11px;height:11px;border-radius:50%;
  border:1px solid var(--line);background:var(--ink);transition:background .2s,border-color .2s}
.stop[data-open="true"]::before{background:var(--gold);border-color:var(--gold)}
.stop:hover::before{border-color:var(--gold)}
.stop-when{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9.5px;letter-spacing:.14em;color:var(--dim);display:flex;gap:9px;align-items:center}
.stop-phase{color:var(--gold);letter-spacing:.16em}
.stop-what{font-family:"Instrument Serif",Georgia,serif;font-size:20px;color:var(--bone);line-height:1.2;margin-top:3px}
.stop-where{font-size:12.5px;color:var(--muted);margin-top:3px}
.stop-detail{font-size:13.5px;color:var(--muted);margin-top:10px;max-width:60ch;border-left:1px solid var(--line);padding-left:14px}
.arc{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:var(--s3);padding:15px 17px;
  border:1px solid var(--line-soft);background:var(--panel);
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.1em;color:var(--muted)}
.arc b{color:var(--gold);font-weight:500}

/* ---------- lab ---------- */
.timeline{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);margin-top:var(--s2)}
.tl{background:var(--panel);padding:12px 11px;display:flex;flex-direction:column;gap:5px;min-height:100px;text-align:left;transition:background .2s}
.tl:hover{background:var(--panel-2)}
.tl .w{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:8.5px;letter-spacing:.16em;color:var(--gold)}
.tl .c{font-size:11.5px;color:var(--text);line-height:1.35}
.tl .s{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:7.5px;letter-spacing:.14em;color:var(--dim);margin-top:auto}
.filters{display:flex;flex-wrap:wrap;gap:7px;margin:var(--s3) 0 var(--s2)}
.note-card{border:1px solid var(--line-soft);background:var(--panel);padding:16px 18px;text-align:left;width:100%;display:block;transition:border-color .18s,background .18s,transform .18s}
.note-card:hover{border-color:var(--gold);background:var(--panel-2);transform:translateY(-2px)}
.note-meta{display:flex;flex-wrap:wrap;gap:9px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9px;letter-spacing:.13em;color:var(--dim);text-transform:uppercase;align-items:center}
.note-title{font-family:"Instrument Serif",Georgia,serif;font-size:20px;color:var(--bone);margin-top:9px;line-height:1.22}
.note-dek{font-size:13.5px;color:var(--muted);margin-top:7px}
.reader{position:fixed;inset:0;z-index:90;background:color-mix(in srgb,var(--ink) 93%,transparent);
  backdrop-filter:blur(8px);display:flex;justify-content:center;overflow-y:auto;
  padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px))}
.reader-inner{max-width:640px;width:100%;background:var(--panel);border:1px solid var(--line);padding:26px 24px 34px;height:max-content}
.reader-body{margin-top:var(--s3);font-size:15.5px;line-height:1.74}
.reader-body p+p{margin-top:14px}
.reader-body h4{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.17em;color:var(--gold);margin-top:22px;text-transform:uppercase}
.reader-close{position:sticky;top:0;float:right;margin:-6px -4px 0 0}
.rd-h{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.17em;color:var(--gold);margin-top:24px;text-transform:uppercase}
.rd-src{margin:9px 0 0;padding-left:18px;font-size:13.5px;color:var(--muted)}
.rd-src li{margin-bottom:5px}
.rd-src a{color:var(--gold)}
.xp{border:1px solid var(--line-soft);background:var(--panel);margin-bottom:var(--s1);transition:border-color .2s}
.xp:hover{border-color:var(--line)}
.xp-head{display:flex;gap:13px;align-items:center;padding:13px 16px;width:100%;text-align:left;transition:background .18s}
.xp-head:hover{background:var(--panel-2)}
.xp-head .id{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;color:var(--dim);flex:0 0 56px}
.xp-head .nm{font-size:14.5px;color:var(--text);flex:1}
.xp-body{padding:2px 16px 18px 72px;background:var(--panel-2)}
.st-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px}
.st-jade{background:var(--jade)} .st-gold{background:var(--gold)} .st-dim{background:var(--dim)}

/* ---------- loop ---------- */
.loopwrap{display:grid;grid-template-columns:196px 1fr;gap:var(--s3);margin-top:var(--s3);align-items:start}
.looprail{position:relative;display:grid;gap:2px;border-left:1px solid var(--line)}
.loopbtn{text-align:left;padding:9px 14px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;
  letter-spacing:.15em;color:var(--muted);border-left:2px solid transparent;margin-left:-1px;
  transition:color .2s,border-color .2s,background .2s,padding-left .2s;display:flex;align-items:center;gap:9px}
.loopbtn:hover{color:var(--text);background:var(--line-soft)}
.loopbtn[aria-pressed="true"]{color:var(--gold);border-left-color:var(--gold);background:var(--gold-soft);padding-left:18px}
.loopbtn .i{font-size:8.5px;color:var(--dim)}
.loopbtn[aria-pressed="true"] .i{color:var(--gold)}
.loopback{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:8.5px;letter-spacing:.14em;color:var(--dim);padding:9px 14px;border-left:2px dashed var(--line);margin-left:-1px}
.loopdetail{background:var(--panel);border:1px solid var(--line-soft);padding:20px;min-height:186px}
.loopdetail .h{font-family:"Instrument Serif",Georgia,serif;font-size:26px;color:var(--bone);line-height:1.1}
.loopdetail .d{margin-top:10px;font-size:14.5px}
.evid{margin-top:var(--s2);padding-top:var(--s2);border-top:1px solid var(--line-soft);display:grid;gap:8px}
.evid .e{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:baseline;font-size:13px;color:var(--muted)}
.evid .e b{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;color:var(--gold);font-variant-numeric:tabular-nums;font-weight:500}
.principles{display:grid}
.principle{display:grid;grid-template-columns:28px 1fr;gap:14px;padding:13px 0;border-top:1px solid var(--line-soft);font-size:14.5px}
.principle:first-child{border-top:none}
.principle .i{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;color:var(--gold);padding-top:3px}
.principle .s{color:var(--muted);font-size:13px;margin-top:3px}

/* ---------- about ---------- */
.tool-group{margin-top:var(--s3)}
.tool-group h3{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.2em;color:var(--gold);margin-bottom:11px;text-transform:uppercase}
.rec-item{padding:11px 0;border-top:1px solid var(--line-soft)}
.rec-item:first-child{border-top:none}
.rec-item .h{display:flex;justify-content:space-between;gap:14px;align-items:baseline;flex-wrap:wrap}
.rec-item .r{font-size:15px;color:var(--bone);font-weight:500}
.rec-item .d{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;color:var(--dim);white-space:nowrap}
.rec-item .o{font-size:13px;color:var(--muted);margin-top:2px}
.rec-item ul{margin:8px 0 0;padding-left:17px;font-size:13.5px;color:var(--text)}
.rec-item li{margin-bottom:5px}

/* ---------- contact ---------- */
.contact-line{font-family:"Instrument Serif",Georgia,serif;font-size:clamp(26px,5vw,42px);color:var(--bone);line-height:1.12}
.links{display:grid;gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);margin-top:var(--s3)}
.link{display:flex;align-items:baseline;gap:14px;padding:15px 18px;background:var(--panel);text-decoration:none;transition:background .18s;flex-wrap:wrap}
.link:hover{background:var(--panel-2)}
.link .k{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9.5px;letter-spacing:.17em;color:var(--dim);flex:0 0 76px;text-transform:uppercase}
.link .v{color:var(--text);font-size:14.5px;word-break:break-word}
.link:hover .v{color:var(--gold)}
footer{padding:34px 0 calc(46px + env(safe-area-inset-bottom,0px));color:var(--dim);font-size:12.5px}

/* ---------- recruiter ---------- */
#recruiter{display:none}
.rec-nav{display:none}
[data-mode="recruiter"] .rec-nav{display:block}
[data-mode="recruiter"] .lab-only{display:none!important}
[data-mode="recruiter"] #recruiter{display:block}
.rec-head{padding-block:46px 10px}
.rec-name{font-family:"Instrument Serif",Georgia,serif;font-size:clamp(32px,6vw,48px);color:var(--bone);line-height:1.05}
.rec-role{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.2em;color:var(--gold);margin-top:12px;text-transform:uppercase}
.rec-sum{display:grid;gap:5px;margin-top:var(--s3);max-width:70ch}
.rec-sum div{display:grid;grid-template-columns:auto 1fr;gap:11px;font-size:15px;align-items:baseline}
.rec-sum b{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.14em;color:var(--gold);font-weight:500}
.rec-sec{padding-block:26px;border-top:1px solid var(--line);scroll-margin-top:70px}
.rec-sec h3{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.22em;color:var(--dim);margin-bottom:14px;text-transform:uppercase}

/* ---------- search ---------- */
.search-overlay{position:fixed;inset:0;z-index:95;background:color-mix(in srgb,var(--ink) 94%,transparent);
  backdrop-filter:blur(10px);display:flex;justify-content:center;
  padding:calc(60px + env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto}
.search-box{max-width:620px;width:100%;height:max-content}
.search-field{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--panel);padding:2px 2px 2px 14px}
.search-field input{flex:1;background:none;border:none;color:var(--text);padding:14px 0;font-size:16px;outline:none}
.search-field input::placeholder{color:var(--dim)}
.search-results{margin-top:var(--s2);display:grid;gap:1px;background:var(--line-soft);border:1px solid var(--line-soft)}
.sr-item{display:grid;grid-template-columns:auto 1fr;gap:13px;padding:13px 15px;background:var(--panel);text-align:left;width:100%;transition:background .15s}
.sr-item:hover{background:var(--panel-2)}
.sr-item .ty{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:8.5px;letter-spacing:.14em;color:var(--gold);padding-top:4px;flex:0 0 auto;min-width:64px}
.sr-item .ti{font-size:14.5px;color:var(--bone)}
.sr-item .ex{font-size:12.5px;color:var(--muted);margin-top:2px}
.search-empty{padding:20px 15px;background:var(--panel);font-size:14px;color:var(--muted)}


/* ---------- corpus: constellation ---------- */
:root{
  --viz-health:#c98500; --viz-ai:#9085e9; --viz-other:#199e70;
  --viz-grid:#1E272E; --viz-bar:#C99A3A;
}
[data-mode="recruiter"]{ --viz-health:#8A6714; --viz-ai:#4a3aa7; --viz-other:#15795a; --viz-grid:#E2DCCE; --viz-bar:#8A6714; }
.const-wrap{position:relative;margin-top:var(--s3);border:1px solid var(--line-soft);background:var(--panel)}
.const-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;
  padding:11px 14px;border-bottom:1px solid var(--line-soft);background:var(--panel-2)}
.const-legend{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.lg{display:inline-flex;align-items:center;gap:6px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9px;letter-spacing:.13em;color:var(--muted);text-transform:uppercase;background:none;border:none;padding:2px 0}
.lg i{width:9px;height:9px;border-radius:50%;display:inline-block}
.lg[aria-pressed="false"]{opacity:.4}
.const-stage{position:relative;aspect-ratio:16/9;width:100%}
.const-stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.const-tip{position:absolute;pointer-events:none;z-index:5;background:var(--ink);border:1px solid var(--gold);
  padding:9px 11px;max-width:250px;opacity:0;transition:opacity .12s}
.const-tip.on{opacity:1}
.const-tip .d{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:8.5px;letter-spacing:.14em;color:var(--gold)}
.const-tip .c{font-size:13.5px;color:var(--bone);margin-top:3px}
.const-tip .m{font-size:11.5px;color:var(--muted);margin-top:4px}
.const-foot{display:flex;flex-wrap:wrap;gap:14px;padding:10px 14px;border-top:1px solid var(--line-soft);
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:8.5px;letter-spacing:.13em;color:var(--dim)}
.const-hero{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);margin-top:var(--s3)}
.ch{background:var(--panel);padding:16px}
.ch .n{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:27px;color:var(--bone);font-variant-numeric:tabular-nums;line-height:1}
.ch .l{font-size:11.5px;color:var(--muted);margin-top:6px}

/* ---------- corpus: atlas ---------- */
.atlas-controls{display:grid;gap:var(--s2);margin-top:var(--s3)}
.atlas-search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);padding:0 12px}
.atlas-search input{flex:1;background:none;border:none;color:var(--text);padding:13px 0;font-size:15px;outline:none}
.atlas-search input::placeholder{color:var(--dim)}
.facet{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.facet .fl{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:8.5px;letter-spacing:.16em;color:var(--dim);margin-right:4px;min-width:62px}
.atlas-count{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9.5px;letter-spacing:.14em;color:var(--muted);margin-top:var(--s2)}
.atlas-list{display:grid;gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);margin-top:var(--s1)}
.cs-row{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:start;padding:14px 16px;background:var(--panel);
  text-align:left;width:100%;transition:background .15s}
.cs-row:hover{background:var(--panel-2)}
.cs-row .day{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;color:var(--gold);padding-top:3px;font-variant-numeric:tabular-nums}
.cs-row .co{font-size:15px;color:var(--bone)}
.cs-row .sm{font-size:12.5px;color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cs-row .meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.cs-row .ev{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.tag{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:8px;letter-spacing:.12em;padding:2px 6px;border:1px solid var(--line);color:var(--dim);text-transform:uppercase}
.tag.on{color:var(--gold);border-color:rgba(210,166,60,.4)}
.ev-pill{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:8px;letter-spacing:.12em;padding:3px 7px;border:1px solid var(--line);white-space:nowrap}
.ev-VERIFIED{color:var(--viz-other);border-color:var(--viz-other)}
.ev-DOCUMENTED{color:var(--gold);border-color:rgba(210,166,60,.5)}
.ev-SOURCED{color:var(--muted)}
.ev-NARRATIVE{color:var(--dim)}
.cs-empty{padding:22px 16px;background:var(--panel);color:var(--muted);font-size:14px}
.atlas-more{margin-top:var(--s2)}

/* ---------- case study detail ---------- */
.cs-panel{position:fixed;inset:0;z-index:92;background:color-mix(in srgb,var(--ink) 93%,transparent);
  backdrop-filter:blur(8px);display:flex;justify-content:center;overflow-y:auto;
  padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px))}
.cs-inner{max-width:620px;width:100%;background:var(--panel);border:1px solid var(--line);padding:24px 22px 30px;height:max-content}
.cs-inner .hd{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9.5px;letter-spacing:.16em;color:var(--gold)}
.cs-inner h3{font-family:"Instrument Serif",Georgia,serif;font-size:27px;color:var(--bone);margin-top:8px;line-height:1.15}
.cs-inner .sub{font-size:14px;color:var(--muted);margin-top:8px}
.cs-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:var(--s3)}
.cs-kv{display:grid;grid-template-columns:132px 1fr;gap:6px 16px;margin-top:var(--s3);font-size:13px}
.cs-kv dt{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:8.5px;letter-spacing:.15em;color:var(--dim);padding-top:3px;text-transform:uppercase}
.cs-kv dd{margin:0;color:var(--text)}

.val-flags{margin-top:var(--s3);border-top:1px solid var(--line-soft);padding-top:var(--s2)}
.vf-h{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:8px;letter-spacing:.15em;color:var(--dim)}
.vf{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline;margin-top:7px;font-size:12px}
.vf-k{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:8px;letter-spacing:.1em;color:var(--gold);
  border:1px solid rgba(210,166,60,.35);padding:2px 6px;white-space:nowrap}
.vf-d{color:var(--muted)}

/* ---------- corpus: charts ---------- */
.viz-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);margin-top:var(--s3)}
.viz{border:1px solid var(--line-soft);background:var(--panel);padding:16px}
.viz h4{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9.5px;letter-spacing:.16em;color:var(--gold);text-transform:uppercase}
.viz .sub{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.4}
.bars{display:grid;gap:5px;margin-top:var(--s2)}
.brow{display:grid;grid-template-columns:54px 1fr 56px;gap:9px;align-items:center;font-size:11px}
.brow .bl{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:8.5px;letter-spacing:.1em;color:var(--muted)}
.brow .bt{height:14px;background:var(--viz-grid);position:relative;overflow:hidden}
.brow .bf{height:100%;background:var(--viz-bar);border-radius:0 3px 3px 0}
.brow .bv{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;color:var(--bone);text-align:right;font-variant-numeric:tabular-nums}
.dist{display:grid;gap:5px;margin-top:var(--s2)}
.drow{display:grid;grid-template-columns:92px 1fr 34px;gap:9px;align-items:center;font-size:11px}
.drow .dl{font-size:11.5px;color:var(--text)}
.drow .dt{height:12px;background:var(--viz-grid);position:relative;overflow:hidden}
.drow .df{height:100%;border-radius:0 3px 3px 0}
.drow .dv{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}

.spark{display:flex;align-items:flex-end;gap:2px;height:78px;margin-top:var(--s2);
  background:linear-gradient(180deg,transparent,var(--viz-grid) 96%);padding-bottom:1px}
.spark .sb{flex:1;background:var(--viz-bar);border-radius:2px 2px 0 0;min-width:3px;transition:opacity .15s}
.spark .sb:hover{opacity:.7}
.spark-axis{display:flex;justify-content:space-between;margin-top:6px;
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:8px;letter-spacing:.12em;color:var(--dim)}
.cs-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:var(--s3);
  padding-top:var(--s2);border-top:1px solid var(--line-soft)}
.cs-nav button[disabled]{opacity:.35;cursor:default}

/* ---------- method graph ---------- */
.caps{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);margin-top:var(--s3)}
.cap{background:var(--panel);padding:15px;display:flex;flex-direction:column;gap:7px;text-align:left;transition:background .18s}
.cap:hover{background:var(--panel-2)}
.cap .ct{font-size:14.5px;color:var(--bone)}
.cap .cm{height:4px;background:var(--viz-grid);position:relative;overflow:hidden}
.cap .cf{height:100%;background:var(--gold)}
.cap .cn{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9px;letter-spacing:.12em;color:var(--muted)}
.cap .cb{font-size:11.5px;color:var(--dim);line-height:1.4}

/* ---------- operating model ---------- */
.model{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:var(--s3)}
.mstep{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--line);background:var(--panel);
  transition:border-color .2s,background .2s,color .2s}
.mstep:hover{border-color:var(--gold);background:var(--panel-2)}
.mstep[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}
.mstep .mi{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:8px;color:var(--dim)}
.mstep .ml{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.14em;color:var(--muted)}
.mstep[aria-pressed="true"] .ml{color:var(--gold)}
.mstep .mc{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9px;color:var(--dim);font-variant-numeric:tabular-nums}
.marr{color:var(--dim);font-size:10px}
.mloop{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:8.5px;letter-spacing:.14em;color:var(--dim);margin-left:4px}
.model-detail{border:1px solid var(--line-soft);background:var(--panel);padding:18px;margin-top:var(--s2);min-height:170px}
.md-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px}
.md-n{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:8.5px;letter-spacing:.16em;color:var(--dim)}
.md-t{font-family:"Instrument Serif",Georgia,serif;font-size:25px;color:var(--bone);line-height:1}
.md-c{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9.5px;color:var(--gold);margin-left:auto;font-variant-numeric:tabular-nums}
.md-b{font-size:14px;color:var(--muted);margin-top:9px;max-width:62ch}
.md-lbl{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:8px;letter-spacing:.15em;color:var(--dim)}
.md-prac{margin-top:14px;display:grid;gap:6px}
.md-p{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:baseline;font-size:13px;color:var(--muted)}
.md-p b{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11.5px;color:var(--gold);font-weight:500;font-variant-numeric:tabular-nums}
.md-cov{height:4px;background:var(--viz-grid);margin-top:7px;overflow:hidden}
.md-covf{display:block;height:100%;background:var(--gold)}
.md-ev{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.md-s{display:flex;flex-direction:column;gap:4px;align-items:flex-start;padding:10px;border:1px solid var(--line);
  background:var(--panel-2);text-align:left;transition:border-color .18s}
.md-s:hover{border-color:var(--gold)}
.md-sd{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:8px;letter-spacing:.14em;color:var(--gold)}
.md-sc{font-size:12.5px;color:var(--text);line-height:1.25}

.om{display:flex;flex-wrap:wrap;align-items:stretch;gap:5px;margin-top:var(--s3)}
.omb{display:flex;flex-direction:column;gap:4px;padding:11px 12px;border:1px solid var(--line);
  background:var(--panel);text-align:left;min-width:104px;flex:1;transition:border-color .2s,background .2s}
.omb:hover{border-color:var(--gold);background:var(--panel-2)}
.omb[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}
.omb-n{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:8px;letter-spacing:.14em;color:var(--dim)}
.omb[aria-pressed="true"] .omb-n{color:var(--gold)}
.omb-l{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9.5px;letter-spacing:.11em;color:var(--text)}
.omb[aria-pressed="true"] .omb-l{color:var(--bone)}
.omb-c{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:14px;color:var(--gold);
  font-variant-numeric:tabular-nums;margin-top:auto}
.omb-arr{align-self:center;color:var(--dim);font-size:10px}
.om-detail{border:1px solid var(--line-soft);background:var(--panel);padding:18px;margin-top:var(--s2);min-height:150px}
.omd-head{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap}
.omd-n{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;color:var(--gold)}
.omd-t{font-family:"Instrument Serif",Georgia,serif;font-size:25px;color:var(--bone)}
.omd-c{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9.5px;letter-spacing:.12em;color:var(--muted);margin-left:auto}
.omd-b{font-size:14px;color:var(--text);margin-top:9px;max-width:64ch}
.omd-ex{display:grid;gap:5px;margin-top:var(--s2)}
.omd-s{display:flex;align-items:center;gap:11px;padding:9px 11px;border:1px solid var(--line-soft);
  background:var(--panel-2);text-align:left;transition:border-color .18s}
.omd-s:hover{border-color:var(--gold)}
.omd-s .d{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9px;color:var(--gold);min-width:48px}
.omd-s .c{font-size:13.5px;color:var(--text);flex:1}

/* ---------- anomalies ---------- */
.anom{border:1px solid rgba(210,166,60,.3);background:var(--gold-soft);padding:16px;margin-top:var(--s3)}
.anom h4{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9.5px;letter-spacing:.16em;color:var(--gold);text-transform:uppercase}
.anom ul{margin:10px 0 0;padding-left:17px;font-size:13px;color:var(--text)}
.anom li{margin-bottom:5px}
.i-arr{color:var(--dim);font-size:10px}


/* ---------- intro: the boot film ---------- */
.intro{position:fixed;inset:0;z-index:120;background:#000;display:flex;align-items:center;justify-content:center;
  opacity:1;transition:opacity .6s ease}
.intro.out{opacity:0;pointer-events:none}
.intro.hold .ov:not(.br){opacity:0;transition:opacity .5s ease}
.film-stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#000}
.film{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.film-vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 54%,rgba(0,0,0,.42) 88%,rgba(0,0,0,.72) 100%)}
.intro .ov{position:absolute;z-index:3;opacity:0;transition:opacity .7s ease .3s}
.intro.ready .ov,.intro.still .ov{opacity:1}
.ov.tl{top:calc(26px + env(safe-area-inset-top,0px));left:26px}
.ov.bl{bottom:calc(64px + env(safe-area-inset-bottom,0px));left:26px}
.ov.br{bottom:calc(26px + env(safe-area-inset-bottom,0px));right:22px}
.ov.sound{bottom:calc(26px + env(safe-area-inset-bottom,0px));left:26px;
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:8.5px;letter-spacing:.16em;
  color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.18);padding:6px 10px;border-radius:2px;
  transition:color .2s,border-color .2s,opacity .7s ease .3s}
.ov.sound:hover{color:#fff;border-color:rgba(255,255,255,.5)}
.ov-mark{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13px;letter-spacing:.2em;
  font-weight:600;color:rgba(255,255,255,.92)}
.ov-mark i{font-style:normal;color:var(--gold)}
.ov-sub{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:8px;letter-spacing:.3em;
  color:rgba(255,255,255,.45);margin-top:5px}
.ov-name{font-family:"Instrument Serif",Georgia,serif;font-size:20px;color:rgba(255,255,255,.92);line-height:1.1}
.ov-skip{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9.5px;letter-spacing:.18em;
  color:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.22);padding:9px 14px;border-radius:2px;
  background:rgba(0,0,0,.25);backdrop-filter:blur(3px);transition:color .2s,border-color .2s,background .2s}
.ov-skip:hover{color:#fff;border-color:var(--gold);background:rgba(0,0,0,.5)}
.intro .ov-skip{opacity:1}
.ov-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.18em;
  color:#fff;border:1px solid rgba(255,255,255,.4);padding:14px 22px;border-radius:2px;
  background:rgba(0,0,0,.45);backdrop-filter:blur(4px);opacity:1!important}
.ov-play:hover{border-color:var(--gold)}
.film-bar{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.1);z-index:4}
.film-bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .25s linear}
.film-load{position:absolute;z-index:4;display:flex;gap:5px}
.film-load span{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.4);animation:blink 1.2s infinite}
.film-load span:nth-child(2){animation-delay:.2s}
.film-load span:nth-child(3){animation-delay:.4s}
.hero-mark.boot{animation:bootin .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes bootin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- hero: person + corpus tease ---------- */
.hero-person{font-family:"Instrument Serif",Georgia,serif;font-size:clamp(19px,2.6vw,25px);
  color:var(--bone);margin-top:10px;letter-spacing:.01em}
.hero-line b{color:var(--bone);font-weight:400;font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:.82em;letter-spacing:.07em;display:inline-block;margin-top:6px}
.corpus-tease{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);flex-wrap:wrap;
  margin-top:var(--s5);padding:20px 22px;border:1px solid var(--line-soft);
  background:linear-gradient(120deg,var(--panel-2),var(--panel) 60%)}
.ct-lines{display:flex;flex-direction:column;gap:3px}
.ct-lines span{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:clamp(13px,2.1vw,17px);
  letter-spacing:.18em;color:var(--muted)}
.ct-lines span.hot{color:var(--gold)}

/* ---------- reveal ---------- */
.rv{transition:opacity .6s ease,transform .6s ease}
.rv.pre{opacity:.5;transform:translateY(10px)}

/* ---------- responsive ---------- */
@media (max-width:1000px){
  .rail{position:fixed;left:0;top:0;bottom:0;z-index:60;transform:translateX(-100%);transition:transform .26s ease;box-shadow:0 0 40px rgba(0,0,0,.5)}
  .rail[data-open="true"]{transform:none}
  .topbar{display:flex}
  .scrim{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.55);border:none}
  section.mod{scroll-margin-top:66px}
  .hero-grid{grid-template-columns:1fr;gap:var(--s4)}
  .orbit{max-width:330px}
  .panels{grid-template-columns:1fr 1fr}
  .exec{grid-template-columns:1fr 1fr}
  .timeline{grid-template-columns:repeat(3,1fr)}
  .grid-3{grid-template-columns:1fr}
  .const-stage{aspect-ratio:4/3}
}
@media (max-width:720px){
  .panels,.grid-2{grid-template-columns:1fr}
  .const-hero{grid-template-columns:1fr}
  .viz-grid,.caps{grid-template-columns:1fr}
  .omb-arr{display:none}
  .omb{min-width:calc(50% - 3px)}
  .md-ev{grid-template-columns:1fr 1fr}
  .model{gap:4px}
  .marr,.mloop{display:none}
  .cs-row{grid-template-columns:36px minmax(0,1fr)}
  .cs-row>span{min-width:0}
  .cs-row .ev{grid-column:2;flex-direction:row;align-items:center;flex-wrap:wrap}
  .ov.tl{top:calc(18px + env(safe-area-inset-top,0px));left:16px}
  .ov.bl{left:16px;bottom:calc(58px + env(safe-area-inset-bottom,0px))}
  .ov.br{right:14px}
  .ov.sound{left:16px}
  .ov-name{font-size:16px}
  .ov-skip{font-size:9px;padding:8px 11px}
  .cs-kv{grid-template-columns:1fr;gap:2px 0}
  .cs-kv dd{margin-bottom:9px}
  .brow{grid-template-columns:46px 1fr 48px}
  .drow{grid-template-columns:78px 1fr 30px}
  .facet .fl{min-width:100%}
  .metrics{grid-template-columns:1fr 1fr}
  .exec{grid-template-columns:1fr}
  .timeline{grid-template-columns:1fr 1fr}
  .kv{grid-template-columns:1fr;gap:2px 0}
  .kv dd{margin-bottom:9px}
  .step{grid-template-columns:1fr;gap:3px}
  .fbar{grid-template-columns:1fr;gap:4px}
  .fbar .val.out{right:8px;transform:translateY(-50%);padding-left:0}
  .loopwrap{grid-template-columns:1fr}
  .looprail{display:flex;flex-wrap:wrap;border-left:none;border-top:1px solid var(--line);padding-top:var(--s1)}
  .loopbtn{border-left:none;border-top:2px solid transparent;margin-left:0}
  .loopbtn[aria-pressed="true"]{border-left-color:transparent;border-top-color:var(--gold);padding-left:14px}
  .loopback{display:none}
  .xp-body,.log-body{padding-left:16px}
  .wi{grid-template-columns:32px 1fr}
  .wi .st{grid-column:2}
  .wrap{padding:0 18px}
  .orbit{max-width:290px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
  canvas#field{display:none}
  .rv.pre{opacity:1;transform:none}
}
html{scroll-behavior:smooth;overflow-x:hidden}
</style>
